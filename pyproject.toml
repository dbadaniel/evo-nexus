[project]
name = "evo-nexus"
version = "0.33.0"
description = "Unofficial open source toolkit for Claude Code — AI-powered business operating system"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "schedule>=1.2",
    "flask>=3.0",
    "flask-cors>=4.0",
    "flask-sqlalchemy>=3.1",
    "flask-login>=0.6",
    "python-dotenv>=1.0",
    "bcrypt>=4.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "flask-sock>=0.7",
    "boto3>=1.35",
    "pywinpty>=3.0.3; sys_platform == 'win32'",
    "cryptography>=42",
    "psycopg2-binary",
    "alembic>=1.13",
    "tiktoken>=0.7",
    "openai>=1.0",
    "google-genai>=0.3",
    "anthropic>=0.25",
    "watchdog>=4.0",
    "sqlparse>=0.4,<1.0",
    "jsonschema>=4.21",
    "flask-limiter>=3.5",
    "websocket-client>=1.7",
]

[project.optional-dependencies]
# Local ML stack for the Knowledge Base: on-device PDF/DOCX/PPTX parsing
# (marker-pdf) and local embeddings (sentence-transformers). Only the
# dashboard (Flask backend, dashboard/backend/knowledge/) uses these —
# the agent runtime images never import that module. Without this extra,
# the Knowledge Base falls back to remote providers (LlamaParse /
# OpenAI / Gemini embeddings) configured via env vars; plain text/markdown
# ingestion is unaffected either way.
knowledge = [
    "torch>=2.11.0",
    "sentence-transformers>=3.0",
    "marker-pdf>=1.6.1",
]
# Long-term agent memory (vector store via chromadb + onnxruntime). Only
# dashboard/backend/routes/mempalace.py imports this — the agent runtime
# talks to it over the dashboard's HTTP API (EvoClient SDK) instead of
# importing the package directly.
memory = [
    "mempalace>=0.1",
]

[project.scripts]
evonexus = "dashboard.backend.knowledge.cli:main"

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.3",
]

[tool.uv.sources]
# Keep Docker/VPS builds on CPU-only PyTorch wheels. Without this, Linux
# resolution can pull CUDA/NVIDIA wheels and inflate the runtime image.
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
